<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060b14" />
    <title>ConvoySync – You're Offline</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #060b14; color: #f1f5f9; }
      main { width: min(100%, 520px); padding: 32px 24px; text-align: center; background: #0f1a2e; border: 1px solid rgba(56,189,248,.24); border-radius: 18px; box-shadow: 0 18px 55px rgba(0,0,0,.35); }
      .icon { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 16px; background: linear-gradient(135deg,#0056b3,#0ea5e9); font-size: 32px; }
      h1 { margin: 0 0 12px; font-size: clamp(1.6rem,5vw,2rem); }
      p { color: #cbd5e1; line-height: 1.65; margin: 0 0 24px; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 10px; background: #0284c7; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }
      small { display: block; margin-top: 20px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🚗</div>
      <h1>You're offline</h1>
      <p>ConvoySync's app shell is saved on this device, but trip details, sign-in and live convoy locations need an internet connection.</p>
      <a href="/">Open ConvoySync</a>
      <small>When you're back online, reconnect and reopen your trip.</small>
    </main>
  </body>
</html>
